<text x="538" y="516" font-family="JetBrains Mono, Consolas, Courier New, monospace" font-size="12" fill="#0f172a">src/strategy/hybrid_strategy.ts（策略选择）</text>
<text x="538" y="534" font-family="JetBrains Mono, Consolas, Courier New, monospace" font-size="12" fill="#0f172a">src/core/self_play.ts + value_trainer.ts（自博弈/训练）</text>
