<text x="538" y="444" font-family="JetBrains Mono, Consolas, Courier New, monospace" font-size="12" fill="#0f172a">src/core/threat_* + pattern_*（威胁分析/缓存）</text>
<text x="538" y="462" font-family="JetBrains Mono, Consolas, Courier New, monospace" font-size="12" fill="#0f172a">src/core/pvs_search.ts（传统搜索）</text>
