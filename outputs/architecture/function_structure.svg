<text x="538" y="366" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">核心引擎（规则/搜索/评估/训练）</text>
<text x="538" y="390" font-family="JetBrains Mono, Consolas, Courier New, monospace" font-size="12" fill="#0f172a">src/types.ts（核心协议）</text>
